# Data Catalog — proyecto "Desempeño de las ventas" (Reto 1)
# Docs: https://docs.kedro.org/en/stable/catalog-data/introduction/

# ---------- 01_raw: tablas originales del curso ----------
raw_sales:
  type: pandas.CSVDataset
  filepath: data/01_raw/sales.csv

raw_products:
  type: pandas.CSVDataset
  filepath: data/01_raw/products.csv

raw_categories:
  type: pandas.CSVDataset
  filepath: data/01_raw/categories.csv

raw_employees:
  type: pandas.CSVDataset
  filepath: data/01_raw/employees.csv

raw_customers:
  type: pandas.CSVDataset
  filepath: data/01_raw/customers.csv

raw_cities:
  type: pandas.CSVDataset
  filepath: data/01_raw/cities.csv

raw_countries:
  type: pandas.CSVDataset
  filepath: data/01_raw/countries.csv
  load_args:
    # el código de Australia es "NA" y pandas lo leería como valor faltante
    keep_default_na: false

# ---------- 02_intermediate: tablas limpias ----------
sales_clean:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/sales_clean.parquet

products_clean:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/products_clean.parquet

employees_clean:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/employees_clean.parquet

# ---------- 03_primary: tabla de ventas unida y enriquecida ----------
sales_primary:
  type: pandas.ParquetDataset
  filepath: data/03_primary/sales_primary.parquet

# ---------- 08_reporting ----------
data_quality_report:
  type: json.JSONDataset
  filepath: data/08_reporting/data_quality_report.json
  save_args:
    indent: 2
    ensure_ascii: false
