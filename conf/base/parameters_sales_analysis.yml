# Parámetros del pipeline sales_analysis
sales_analysis:
  # Nivel de significancia para las pruebas estadísticas
  alpha: 0.05
  # Variables de perfil que se contrastan contra el desempeño
  profile_features: [Age, TenureYears, AgeAtHire]
  # Un vendedor está "por encima" / "por debajo" si su ingreso se aleja
  # del promedio del equipo más que este porcentaje
  performance_band_pct: 0.5
