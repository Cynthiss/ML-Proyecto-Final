# Data Catalog — proyecto "Desempeño de las ventas" (Reto 1)
# Docs: https://docs.kedro.org/en/stable/catalog-data/introduction/

# ---------- 01_raw: tablas originales del curso ----------
raw_sales:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/sales.csv

raw_products:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/products.csv

raw_categories:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/categories.csv

raw_employees:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/employees.csv

raw_customers:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/customers.csv

raw_cities:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/cities.csv

raw_countries:
  type: pandas.CSVDataset
  filepath: ${globals:paths.raw}/countries.csv
  load_args:
    # el código de Australia es "NA" y pandas lo leería como valor faltante
    keep_default_na: false

# ---------- 02_intermediate: tablas limpias ----------
sales_clean:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/02_intermediate/sales_clean.parquet

products_clean:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/02_intermediate/products_clean.parquet

employees_clean:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/02_intermediate/employees_clean.parquet

# ---------- 03_primary: tabla de ventas unida y enriquecida ----------
sales_primary:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/03_primary/sales_primary.parquet

# ---------- 08_reporting ----------
data_quality_report:
  type: json.JSONDataset
  filepath: ${globals:paths.data}/08_reporting/data_quality_report.json
  save_args:
    indent: 2
    ensure_ascii: false

# ---------- 04_feature ----------
seller_daily:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/04_feature/seller_daily.parquet

seller_features:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/04_feature/seller_features.parquet

# ---------- 05_model_input ----------
model_input_train:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/05_model_input/train.parquet

model_input_test:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/05_model_input/test.parquet

# ---------- 06_models ----------
ridge_model:
  type: pickle.PickleDataset
  filepath: ${globals:paths.data}/06_models/ridge_model.pkl

lightgbm_model:
  type: pickle.PickleDataset
  filepath: ${globals:paths.data}/06_models/lightgbm_model.pkl

best_params:
  type: json.JSONDataset
  filepath: ${globals:paths.data}/06_models/best_params.json
  save_args:
    indent: 2

optuna_trials:
  type: pandas.CSVDataset
  filepath: ${globals:paths.data}/06_models/optuna_trials.csv
  save_args:
    index: false

# ---------- 07_model_output ----------
test_predictions:
  type: pandas.ParquetDataset
  filepath: ${globals:paths.data}/07_model_output/test_predictions.parquet

# ---------- 08_reporting: evaluación ----------
model_metrics:
  type: pandas.CSVDataset
  filepath: ${globals:paths.data}/08_reporting/model_metrics.csv
  save_args:
    index: false

model_selection:
  type: json.JSONDataset
  filepath: ${globals:paths.data}/08_reporting/model_selection.json
  save_args:
    indent: 2
    ensure_ascii: false

feature_importance:
  type: pandas.CSVDataset
  filepath: ${globals:paths.data}/08_reporting/feature_importance_shap.csv
  save_args:
    index: false

plot_shap_summary:
  type: matplotlib.MatplotlibDataset
  filepath: ${globals:paths.data}/08_reporting/shap_summary.png
  save_args:
    dpi: 150
    bbox_inches: tight

