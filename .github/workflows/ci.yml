name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with pytest
        run: pytest

      # Los datos completos (~500 MB) no están en el repositorio: el pipeline se
      # valida con la muestra de data/00_sample usando el entorno "ci".
      - name: Run Kedro pipeline (sample data)
        run: kedro run --env ci --params "model_training.optuna.n_trials=5"
