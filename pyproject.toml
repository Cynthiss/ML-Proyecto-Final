[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "sales_performance"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.8.0",
    "kedro-datasets[pandas-csvdataset,pandas-parquetdataset,matplotlib-matplotlibdataset,pickle-pickledataset,json-jsondataset]>=8.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
sales-performance = "sales_performance.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]

[tool.setuptools.dynamic.version]
attr = "sales_performance.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "sales_performance"
project_name = "sales-performance"
kedro_init_version = "1.8.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/sales_performance -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# los notebooks de exploración usan print/display para mostrar resultados
"notebooks/*" = ["T201", "E402", "PLR2004"]
# en las pruebas los valores esperados se escriben explícitamente
"tests/*" = ["PLR2004"]

[tool.kedro_telemetry]
project_id = "b42a0747dfc94ef59c5ac9649d299ce4"
